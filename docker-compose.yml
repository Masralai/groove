services:
  postgres:
    image: postgres:16-alpine
    container_name: groove_postgres
    environment:
      POSTGRES_DB: groove
      POSTGRES_USER: groove
      POSTGRES_PASSWORD: groove
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: groove_mongodb
    environment:
      MONGO_INITDB_DATABASE: groove
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: groove_backend
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_AD_ACCOUNT_ID=${META_AD_ACCOUNT_ID}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://localhost:1234/v1}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-gemma-4-e4b}
      - POSTGRES_DSN=postgresql+asyncpg://groove:groove@localhost:5432/groove
      - POSTGRES_READONLY_DSN=${POSTGRES_READONLY_DSN:-}
      - MONGODB_URI=mongodb://localhost:27017/groove
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 180"

  frontend:
    build:
      context: ./frontend
      args:
        - API_URL=http://localhost:8000
    container_name: groove_frontend
    network_mode: host
    depends_on:
      - backend
    environment:
      - HOSTNAME=0.0.0.0

volumes:
  postgres_data:
  mongodb_data: