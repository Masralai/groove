version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: groove_postgres
    environment:
      POSTGRES_DB: groove
      POSTGRES_USER: groove
      POSTGRES_PASSWORD: groove
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: groove_mongodb
    environment:
      MONGO_INITDB_DATABASE: groove
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: groove_backend
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_AD_ACCOUNT_ID=${META_AD_ACCOUNT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_DSN=postgresql+asyncpg://groove:groove@postgres:5432/groove
      - MONGODB_URI=mongodb://mongodb:27017/groove
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  mongodb_data: