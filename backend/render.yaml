services:
  - type: web
    name: groove-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: CORS_ORIGINS
        value: https://groove-<your-username>.vercel.app
      - key: POSTGRES_DSN
        fromDatabase:
          name: groove-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: groove-postgres
    plan: free
    databaseName: groove
    postgresMajorVersion: 16
